name: Job Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

jobs:
  job-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect vacancies
        run: python main.py

      - name: Filter vacancies
        run: python filters.py

      - name: Enrich vacancies
        run: python enrich.py

      - name: Score vacancies
        run: python scoring.py

      - name: Send vacancies to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py