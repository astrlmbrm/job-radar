name: Job Radar

on:
  workflow_dispatch:
    inputs:
      ai_enabled:
        description: "Enable paid AI analysis for this manual run"
        type: boolean
        default: false
      ai_max_vacancies:
        description: "AI request limit (0–20)"
        type: string
        default: "3"

  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: job-radar-history
  cancel-in-progress: false

jobs:
  job-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AI_ENABLED: ${{ github.event_name == 'workflow_dispatch' && toJSON(inputs.ai_enabled) || vars.AI_ENABLED || 'false' }}
      AI_MAX_VACANCIES: ${{ inputs.ai_max_vacancies || vars.AI_MAX_VACANCIES || '20' }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-nano' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect vacancies
        run: python main.py

      - name: Filter vacancies
        run: python filters.py

      - name: Enrich vacancies
        run: python enrich.py

      - name: Score vacancies
        run: python scoring.py

      - name: Analyze promising vacancies with AI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ai_analyzer.py

      - name: Send new vacancies to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

      - name: Save sent vacancy history
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "Job Radar Bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add sent_vacancies.json

          if git diff --cached --quiet; then
            echo "No new vacancy IDs to save."
          else
            git commit -m "Update sent vacancy history"
            git push
          fi
