name: Job Radar

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  job-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect vacancies
        run: python main.py

      - name: Filter vacancies
        run: python filters.py

      - name: Enrich vacancies
        run: python enrich.py

      - name: Score vacancies
        run: python scoring.py

      - name: Send new vacancies to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

      - name: Save sent vacancy history
        run: |
          git config user.name "Job Radar Bot"
          git config user.email "job-radar-bot@users.noreply.github.com"
          git add sent_vacancies.json

          if git diff --cached --quiet; then
            echo "No new vacancy IDs to save."
          else
            git commit -m "Update sent vacancy history"
            git push
          fi