name: Test combined radar without Telegram

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect HH and Job Hunters
        run: python main.py
      - name: Filter
        run: python filters.py
      - name: Enrich
        run: python enrich.py
      - name: Score
        run: python scoring.py
      - name: Summarize by source
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          for fn in ['vacancies.json', 'filtered_vacancies.json', 'scored_vacancies.json']:
              with open(fn, encoding='utf-8') as f: data=json.load(f)
              print(fn, len(data), dict(Counter(v.get('source','?') for v in data)))
          PY
      - name: Preview Job Hunters notification candidates (no Telegram)
        run: |
          python - <<'PY'
          import json
          with open('scored_vacancies.json',encoding='utf-8') as f: rows=json.load(f)
          for v in rows:
              if v.get('source') != 'jobhunters': continue
              salary_cap = v.get('salary_to')
              under_budget = v.get('currency')=='RUB' and salary_cap is not None and salary_cap<80000
              sendable = v.get('category') in ('HOT','GOOD') and not under_budget
              print('JOBHUNTERS:',repr(v.get('title')),'category=',v.get('category'),'score=',v.get('score'),'salary=',repr(v.get('salary_text')),'sendable=',sendable,'url=',v.get('url'))
              print('  positive:',v.get('positive_reasons'))
              print('  negative:',v.get('negative_reasons'))
          PY
