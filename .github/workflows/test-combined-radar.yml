name: Test combined radar without Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Collect HH and Job Hunters
        run: python main.py
      - name: Filter
        run: python filters.py
      - name: Enrich
        run: python enrich.py
      - name: Score
        run: python scoring.py
      - name: Summarize by source
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          for fn in ['vacancies.json', 'filtered_vacancies.json', 'scored_vacancies.json']:
              with open(fn, encoding='utf-8') as f: data=json.load(f)
              print(fn, len(data), dict(Counter(v.get('source','?') for v in data)))
          PY
