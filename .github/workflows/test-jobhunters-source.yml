name: Smoke test Job Hunters source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Test collector without notifications
        run: python -m sources.jobhunters
